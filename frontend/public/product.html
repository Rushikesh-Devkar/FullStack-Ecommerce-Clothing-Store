<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Products</title>
    <style>
        h1{
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 5px;
        }
        .card {
            background-color: rgb(222, 211, 211);
            border-radius: 5px;
            overflow: hidden;
        }
        .card img {
            width: 80%;
            height: 80%;
        }
        .card h2 {
            color: #333;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Top Products</h1>
    <div class="grid">
        <div class="card">
            <img src="hand m.jpeg" alt="shoppert">
            <h2>H and M </h2>
        </div>
        <div class="card">
            <img src="nike.jpg" alt="SHOPPER">
            <h2>SHOPPER</h2>
        </div>
        <div class="card">
            <img src="adidas.jpg" alt="Yz brand">
            <h2>Yz brand</h2>
        </div>
        <div class="card">
            <img src="yz.jpg" alt="Yz brand">
            <h2>Yz brand</h2>
        </div>
        <div class="card">
            <img src="puma.jpg" alt="puma aaa">
            <h2>puma aaa</h2>
        </div>
        <div class="card">
            <img src="lycraa.jpg" alt="lykraaa">
            <h2>lykraaa</h2>
        </div>
    </div>
</body>
</html>
