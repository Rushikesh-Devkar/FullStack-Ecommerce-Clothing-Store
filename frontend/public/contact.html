<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(to right, #007bff, #0056b3);
            color: white;
            border-radius: 5px;
            margin-top: 5rem;
            margin-bottom: 5rem;
            
        }
        .shop-details {
            width: 45%;
            margin-right: 2%;
            
        }
        .shop-name {
            font-size: 2rem;
            margin-bottom: 1rem;
            align-items: center;
        }
        .shop-info {
            margin-bottom: 2rem;
        }
        .contact-form {
            width: 45%;
            margin-left: 2%;
        }
        .form-field {
            display: block;
            width: 100%;
            margin-bottom: 1rem;
            padding: 0.5rem;
            border-radius: 5px;
            border: 1px solid white;
            background-color: rgba(255, 255, 255, 0.2);
        }
        .form-field:focus {
            outline: none;
            box-shadow: 0 0 5px 1px white;
        }
        .form-button {
            background-color: white;
            color: #007bff;
            border: none;
            border-radius: 5px;
            padding: 0.5rem 2rem;
            cursor: pointer;
        }
        .form-button:hover {
            background-color: #0056b3;
            color: white;
        }
    </style>
</head>
<body>
   
    <div class="container">
        <img src="shopper1.jpg"align-items=right width="40%" height="50%">
       
        <div class="shop-details">
            <h2 class="shop-name">SHOPPER</h2>
            <p class="shop-info">Address: MIT, stara parisar, CH Sambhajinagar, Maharashtra</p>
            <p class="shop-info">Phone:7385429226</p>
            <p class="shop-info">Email:shopper@gmail.com</p>
            <p class="shop-info"><a href="https://goo.gl/maps/2LvHMoCtgyvqNszx8"> shop addresses on google map</a></p>
        </div>
        
    </div>
</body>
</html>
